data:
    name: megadepth
    preprocessing:
        resize: 1024
        side: long
        square_pad: True
    train_split: train_scenes_clean.txt
    train_num_per_scene: 300
    val_split: valid_scenes_clean.txt
    val_pairs: valid_pairs.txt
    min_overlap: 0.1
    max_overlap: 0.7
    num_overlap_bins: 3
    read_depth: false
    read_image: false
    batch_size: 32
    num_workers: 14
    load_features:
        do: true  # enable this if you have cached predictions
        path: exports/megadepth-undist-depth-r1024_RIPE-k2048-nms3/{scene}.h5
        padding_length: 2048
        padding_fn: pad_local_features
data_val:
    name: megadepth
    preprocessing:
        resize: 1024
        side: long
        square_pad: True
    train_split: train_scenes_clean.txt
    train_num_per_scene: 300
    val_split: valid_scenes_clean.txt
    val_pairs: valid_pairs.txt
    min_overlap: 0.1
    max_overlap: 0.7
    num_overlap_bins: 3
    read_depth: true
    read_image: true
    batch_size: 8
    num_workers: 10
    load_features:
        do: false  # enable this if you have cached predictions
        path: exports/megadepth-undist-depth-r1024_RIPE-k2048-nms3/{scene}.h5
        padding_length: 2048
        padding_fn: pad_local_features
model:
    name: two_view_pipeline
    extractor:
        name: extractors.ripepp
        inference_conf:
          threshold: 0.5
          top_k: 512
          nms_size: 3
          subpixel_sampling: true
        variant: default
    matcher:
        name: matchers.rl_lightglue
        min_matches: 0  # If >0, augment mutual matches with NN to reach this target
        filter_threshold: 0.1
        flash: false
        checkpointed: true
        loss:
            inlier_reward: 1.0
            outlier_penalty: -1.0
            use_baseline: false
            reward_based_on_sampson_distance: false
            kernel:
                type: huber
                delta: 1.0
                threshold: 2.0 # this should be slightly larger than estimator.inlier_threshold
                outlier_penalty: ${model.matcher.loss.outlier_penalty}
            fp_penalty: -1e-7
            kp_penalty: 0.0001
            estimator:
                toolkit: opencv
                inlier_threshold: 1.5
                max_iterations: 100000
                success_prob: 0.9999
    ground_truth:
        name: matchers.nearest_neighbor_matcher
    allow_no_extract: True
train:
    logger:
        project_name: ripe+lightglue
        experiment_name: rl
        mode: online
    seed: 0
    epochs: 50
    log_every_iter: 100
    eval_every_iter: 1000
    test_every_epoch: 1  # Run benchmarks every epoch
    select_by_test: true  # Select best model based on test/benchmark results
    metric_direction: higher # is higher or lower better
    best_key_test: megadepth1500/rel_pose_error@5°  # Metric to use for best checkpoint (format: benchmark_name/metric)
    best_key_val: loss/total
    anneal_softmax_temperature:
        do: false
        start: 15.0
        end: 50.0
        epochs: 20
    lr: 1e-5
    lr_schedule:
        start: 30
        type: exp
        on_epoch: true
        exp_div_10: 10
    dataset_callback_fn: sample_new_items
    plot: [5, 'gluefactory.visualization.visualize_batch.make_match_figures']
benchmarks:
    megadepth1500:
        data:
            preprocessing:
                side: long
                resize: 1600
        eval:
            estimator: poselib
            ransac_th: 0.5